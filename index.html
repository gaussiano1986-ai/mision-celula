()=>{S.k=0;return`<div class="c"><h2>🐾🌿 Célula animal y célula vegetal</h2><div class="gr"><div>${cell(0)}<p class="ctr s">Animal</p></div><div>${cell(1)}<p class="ctr s">Vegetal</p></div></div><div class="c" id="cd">👆 Toca las partes para ver su función.</div><p>🤝 <b>Ambas</b> tienen membrana, citoplasma, núcleo, mitocondrias y ribosomas.</p><p>🌿 La <b>vegetal</b> tiene además <b>pared celular</b> (soporte y protección), <b>cloroplastos</b> (fotosíntesis) y una <b>vacuola central grande</b>.</p><button onclick="say('La célula vegetal tiene estructuras especiales que le permiten producir su propio alimento y mantener su forma')">🔊 Escuchar</button><div class="c"><h3>🗂️ Clasifica: esta estructura está en…</h3><p class="s" id="cn">Estructura 1 de ${CL.length}</p><h2 id="ci">${CL[0][0]}</h2><button onclick="cl('a')">🐾 Célula animal</button><button class="g" onclick="cl('v')">🌿 Célula vegetal</button><button class="y" onclick="cl('b')">🤝 Ambas</button>${rg('cl','¿Es algo que tienen todas las células o solo una?','¡Muy bien! Ambas comparten membrana, núcleo y mitocondrias; la vegetal suma pared, cloroplastos y vacuola central.',2,-1)}</div></div>`},
()=>`<div class="c"><h2>🦠 Procariotas y eucariotas</h2><div class="gr"><div class="c"><h3>Procariota</h3><p>No tiene núcleo definido: su ADN flota en el citoplasma. Ejemplo: las bacterias.</p>${BA}</div><div class="c"><h3>Eucariota</h3><p>Tiene núcleo definido y organelos con membrana. Ejemplos: células animales y vegetales.</p>${cell(0)}</div></div><div class="gr">${[['🦠','Bacteria','Procariota · unicelular'],['🐾','Célula animal','Eucariota'],['🌿','Célula vegetal','Eucariota'],['🍞','Levadura','Eucariota · unicelular']].map(x=>`<div class="c ctr">${x[0]}<br><b>${x[1]}</b><br><span class="s">${x[2]}</span></div>`).join('')}</div>${yt('Procariotas y eucariotas','Células procariotas y eucariotas')}${quiz('q6','¿Cuál de estos seres está formado por una célula procariota?',['Una bacteria','Un perro','Una planta'],0,'No tiene núcleo definido.','Las bacterias son procariotas: su ADN flota sin un núcleo definido.',2,-1)}</div>`,
()=>`<div class="c"><h2>🌎 Células en la vida real</h2><p>Las células permiten que vivas, crezcas y repares tus tejidos.</p><div class="gr">${EX.map(x=>`<div class="c"><div class="im">${x[0]}</div><p>${x[1]}</p></div>`).join('')}</div>${quiz('q7','🤔 Reflexiona: ¿por qué las células musculares necesitan muchas mitocondrias?',['Porque gastan mucha energía al moverse','Porque hacen fotosíntesis','Porque almacenan agua'],0,'Piensa en la central eléctrica de la célula.','Las mitocondrias producen energía, y el músculo necesita mucha para moverte.',2,-1)}</div>`,
()=>{S.pick=k=>{Q.p1.n=`Tocaste ${I[k]?I[k][0]:'otra parte'}, que no controla lo que entra y sale. Busca la frontera de la célula.`;chk('p1',k=='mem')};return`<div class="c"><h2>🔍 Práctica 1: identifica la estructura</h2><p>Toca la parte de la célula que responde: <b>¿qué estructura controla lo que entra y sale de la célula?</b></p>${cell(0)}${rg('p1','Es la frontera de la célula.','La membrana plasmática controla lo que entra y sale.',5,0)}</div>`},
()=>{S.a=S.b=null;S.n=0;const P=[['Núcleo','guarda el ADN'],['Mitocondria','produce energía'],['Cloroplasto','realiza la fotosíntesis'],['Ribosoma','ayuda a producir proteínas'],['Vacuola','almacena sustancias']];return`<div class="c"><h2>🔗 Práctica 2: asocia funciones</h2><p>Toca un organelo y su función (en cualquier orden).</p><div class="gr"><div>${P.map((p,i)=>`<button class="o" id="a${i}" onclick="mt2('a',${i})">${p[0]}</button>`).join('')}</div><div>${[2,4,0,1,3].map(i=>`<button class="o" id="b${i}" onclick="mt2('b',${i})">${P[i][1]}</button>`).join('')}</div></div>${rg('p2','Piensa en el trabajo de cada parte de la fábrica.','Cada organelo tiene un trabajo especial.',5,1)}</div>`},
()=>{S.pick=()=>{};return`<div class="c"><h2>🌱 Práctica 3: ¿animal o vegetal?</h2>${cell(1)}${quiz('p3','Esta célula tiene pared celular y cloroplastos. ¿Es animal o vegetal?',['Célula animal','Célula vegetal'],1,'Busca la pared y los cloroplastos verdes.','Es vegetal: la pared celular y los cloroplastos solo están en las células vegetales.',5,2)}</div>`},
()=>reto(1,'La puerta de entrada','membrana plasmática','🚪',quiz('r1','¿Cuál es la unidad básica de estructura y función de los seres vivos?',['El tejido','La célula','El órgano','La molécula'],1,'Es el “ladrillo” de todo ser vivo.','La célula es la unidad básica de los seres vivos.',10,0)),
()=>reto(2,'El centro de mando','núcleo','🧬',quiz('r2','¿Qué organelo guarda el ADN y controla las actividades de la célula?',['La vacuola','El núcleo','El lisosoma','La pared celular'],1,'Es como la oficina principal de la célula.','El núcleo es el centro de control de la célula.',10,1)),
()=>{let h=quiz('r3','¿Qué organelo se encarga principalmente de producir energía para la célula?',['Mitocondria','Ribosoma','Aparato de Golgi','Membrana plasmática'],0,'Es la central eléctrica de la fábrica.','La mitocondria produce la energía que la célula usa.',10,2);Q.r3.a='¡Has encontrado la central energética de la célula!';return reto(3,'La central energética','mitocondria',MI+'⚡🔋',h+yt('La mitocondria','La mitocondria para niños'))},
()=>reto(4,'El jardín solar','cloroplasto',CH+'☀️🍃',quiz('r4','¿Cuál de estas estructuras está en las células vegetales y realiza la fotosíntesis?',['Lisosoma','Cloroplasto','Centriolo','Ribosoma'],1,'Es verde y trabaja con la luz del sol.','Los cloroplastos usan la luz solar para producir alimento.',10,3)+yt('La fotosíntesis','La fotosíntesis y los cloroplastos para niños')),
()=>reto(5,'El control de acceso','membrana plasmática','🛂',quiz('r5','¿Qué estructura rodea la célula y controla qué entra y qué sale de ella?',['Citoplasma','Núcleo','Membrana plasmática','Vacuola'],2,'Es el guardia de la puerta de la célula.','La membrana plasmática deja pasar solo lo que la célula necesita.',10,5)),
()=>`<div class="c"><h2>🧪 Laboratorio de evaluación</h2><div class="im">💻❓</div><p><span class="dr">🧑‍🔬</span> Ingresa al Kahoot, responde las preguntas sobre la célula y obtén la última pista.</p><button class="y go" style="font-size:20px" onclick="kh()">JUGAR KAHOOT: LA CÉLULA</button><button onclick="say('Agente, demuestra todo lo que aprendiste en el laboratorio digital')">🔊 Escuchar</button><details><summary>👩‍🏫 Docente: ¿cómo agrego mi Kahoot?</summary><p>Crea o elige un Kahoot sobre la célula en kahoot.com, pulsa “Compartir” y pega el enlace aquí. También puedes escribirlo en la constante KU del código. Sin enlace, el botón abre kahoot.com.</p><input id="khu" placeholder="https://kahoot.it/…" style="width:100%"></details><p><b>Al terminar el Kahoot, confirma:</b></p><button class="g" onclick="chk('kh',true)">✅ Ya terminé el Kahoot</button>${rg('kh','Responde el Kahoot y vuelve aquí.','¡Gran trabajo en el laboratorio digital!',10,4)}</div>`,
()=>`<div class="c ctr"><h2>🔐 Código final</h2><div class="im">🔓</div><p>Tus letras, en orden:</p>${[...W].map((c,i)=>`<span class="sl" style="width:42px;height:48px;font-size:22px">${S.L[i]?c:'?'}</span>`).join('')}<p>Escribe la palabra secreta:</p><input id="cw" maxlength="12" style="font-size:22px;text-align:center;text-transform:uppercase" onkeydown="event.key=='Enter'&&fin()"><br><button class="y" onclick="fin()">🔑 Liberar al Dr. Micro</button>${rg('code','Une las letras de izquierda a derecha: es la palabra de la que trata todo el juego.','¡Misión cumplida! Has liberado al Dr. Micro 🎆🎉',15,-1,'Código incorrecto. Revisa las letras obtenidas en cada reto.')}</div>`,
()=>{let p=S.pts,l=p>=90?['🏆','¡Excelente Agente Celular!']:p>=70?['🥈','¡Muy bien, casi dominas la célula!']:['📘','Buen intento. Revisa la teoría y vuelve a intentarlo'];return`<div class="c ctr"><span class="dr">🧑‍🔬</span><h2>¡Felicidades, agente!</h2><div class="im">${l[0]}</div><h2>${l[1]}</h2><p><b>${p} / 100 puntos</b></p></div><div class="c"><h3>📋 Resumen visual</h3>${cell(0)}<p class="s">🛂 Membrana: controla entradas y salidas · 💧 Citoplasma: medio interno · 🧠 Núcleo: guarda el ADN · ⚡ Mitocondria: energía · 🏭 Ribosomas: proteínas · 🎒 Vacuola: almacén · 🌿 La vegetal suma pared, cloroplastos y vacuola central.</p></div><div class="c"><h3>💭 Reflexiona</h3>${['¿Cuál es la función del núcleo?','¿Qué diferencia hay entre una célula animal y una vegetal?','¿Por qué la mitocondria es importante para la célula?'].map((q,i)=>`<p>${i+1}. ${q}</p><textarea rows="2" style="width:100%"></textarea>`).join('')}</div><div class="ctr"><button class="y" onclick="again()">🔁 Volver a jugar</button><button class="g" onclick="badge()">🏅 Ver insignia de Agente Celular</button><div id="bd"></div></div>`},
()=>`<div class="c"><h2>📚 Referencias</h2><p class="ap">Khan Academy. (2026, noviembre 23). <i>Introducción a las células</i> [Video]. YouTube. <a href="https://es.khanacademy.org/science/biology/structure-of-a-cell/introduction-to-cells/a/intro-to-cells" target="_blank" rel="noopener">https://es.khanacademy.org/science/biology/structure-of-a-cell/introduction-to-cells/a/intro-to-cells</a></p><p class="ap">Genially. (2026). <i>Cómo crear un escape room interactivo y gamificado con Genially</i>. <a href="https://genially.com/es/crear/escape-room/" target="_blank" rel="noopener">https://genially.com/es/crear/escape-room/</a></p></div>`];
function nav(){let i=S.i,n=$('#nv'),d=S.d[i];n.innerHTML=i<2?'':`<button class="g" onclick="go(${i-1})">‹ Atrás</button>`+(i<19?`<button ${d?'class="go"':'disabled'} onclick="go(${i+1})">${d?'Siguiente ›':({5:'🔒 Clasifica las 7 estructuras',9:'🔒 Une las 5 parejas',16:'🔒 Confirma el Kahoot',17:'🔒 Escribe la palabra'})[i]||'🔒 Responde para avanzar'}</button>`:'')}
function upd(){let n=0;for(let k in S.d)if(k>7&&k<18)n++;$('#pb').style.width=n*10+'%';$('#sl').innerHTML=[...W].map((c,i)=>`<span class="sl">${S.L[i]?c:'?'}</span>`).join('');$('#pt').textContent=`⭐ ${S.pts} pts · Retos ${n}/10`;nav()}
function go(i){try{speechSynthesis.cancel()}catch(e){}S.i=i;S.pick=card;[0,1,4,18,19].includes(i)&&(S.d[i]=1);$('#m').innerHTML=SC[i]();scrollTo(0,0);upd()}
function tick(){let r=Math.max(0,3600-((Date.now()-t0)/1000|0)),t=$('#tm');t.style.setProperty('--p',r/36+'%');t.textContent=r?'⏱ '+String(r/60|0).padStart(2,'0')+':'+String(r%60).padStart(2,'0'):'⏱ ¡Se acabó el tiempo!'}
function start(){t0=Date.now();clearInterval(tid);tid=setInterval(tick,1000);mt||mus();go(1);say('Agente celular, el Dr. Micro necesita tu ayuda. Has entrado en una célula gigante. Resuelve los retos, obtén las letras secretas y libéralo antes de que se agote la energía.')}
function again(){S=ns();for(let k in Q)delete Q[k];clearInterval(tid);$('#tm').textContent='⏱ 60:00';$('#tm').style.setProperty('--p','100%');go(0)}
document.addEventListener('click',e=>{let t=e.target.closest('[data-k]');if(t){snd('c');S.pick(t.dataset.k)}else if(e.target.closest('button'))snd('c')});
go(0);
</script></body></html>
